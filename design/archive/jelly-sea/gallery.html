<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jelly · Sea creature avatars</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#172b47;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:36px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:26px}h1{font-size:28px;letter-spacing:-.8px;margin:0 0 5px}p{margin:0;color:#64758a;font-size:14px}.selection{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e1ebf8;border-radius:18px;padding:12px 18px;min-width:208px}.selection img{width:42px;height:42px;border-radius:50%;object-fit:cover}.selection strong{display:block;font-size:15px}.selection span{font-size:12px;color:#64758a}.avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.avatar-option{position:relative;padding:14px 12px 12px;background:white;border:2px solid transparent;border-radius:22px;font:inherit;color:inherit;cursor:pointer;transition:border-color .16s,transform .16s;box-shadow:0 2px 12px #23426705}.avatar-option:hover{transform:translateY(-2px);border-color:#bdd9ff}.avatar-option img{display:block;width:150px;height:150px;max-width:100%;object-fit:cover;margin:0 auto 9px;border-radius:50%}.avatar-option span{display:block;font-size:14px;font-weight:550}.avatar-option b{display:none;position:absolute;right:16px;top:12px;width:23px;height:23px;background:#1672f8;color:white;border:3px solid white;border-radius:50%;font-size:12px;line-height:17px}.avatar-option[aria-pressed=true]{border-color:#1672f8;background:#f0f7ff}.avatar-option[aria-pressed=true] b{display:block}footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;color:#667891;font-size:13px}a{color:#1267dd;text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible{outline:3px solid #172b47;outline-offset:4px}@media(max-width:650px){main{padding:24px 16px}header{align-items:flex-start;gap:14px;flex-direction:column}.selection{width:100%}.avatars{grid-template-columns:repeat(3,1fr);gap:8px}.avatar-option{padding:9px 5px;border-radius:16px}.avatar-option img{width:100%;height:auto}.avatar-option span{font-size:12px}.avatar-option b{right:5px;top:5px}h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<header><div><h1>Choose an avatar</h1><p>Twelve little sea creatures for Jelly.</p></div><div class="selection"><img id="selected-avatar" src="avatars/01-jellyfish.png" alt=""><div><strong>Jelly</strong><span id="selected-name" role="status">Jellyfish · Selected for preview</span></div></div></header>
<div class="avatars" aria-label="Agent avatars"><button class="avatar-option" type="button" data-name="Jellyfish" data-file="avatars/01-jellyfish.png" aria-pressed="true" aria-label="Choose Jellyfish"><img src="avatars/01-jellyfish.png" alt="Jellyfish avatar"><span>Jellyfish</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Octopus" data-file="avatars/02-octopus.png" aria-pressed="false" aria-label="Choose Octopus"><img src="avatars/02-octopus.png" alt="Octopus avatar"><span>Octopus</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Whale" data-file="avatars/03-whale.png" aria-pressed="false" aria-label="Choose Whale"><img src="avatars/03-whale.png" alt="Whale avatar"><span>Whale</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Sea turtle" data-file="avatars/04-sea-turtle.png" aria-pressed="false" aria-label="Choose Sea turtle"><img src="avatars/04-sea-turtle.png" alt="Sea turtle avatar"><span>Sea turtle</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Crab" data-file="avatars/05-crab.png" aria-pressed="false" aria-label="Choose Crab"><img src="avatars/05-crab.png" alt="Crab avatar"><span>Crab</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Pufferfish" data-file="avatars/06-pufferfish.png" aria-pressed="false" aria-label="Choose Pufferfish"><img src="avatars/06-pufferfish.png" alt="Pufferfish avatar"><span>Pufferfish</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Seahorse" data-file="avatars/07-seahorse.png" aria-pressed="false" aria-label="Choose Seahorse"><img src="avatars/07-seahorse.png" alt="Seahorse avatar"><span>Seahorse</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Manta ray" data-file="avatars/08-manta-ray.png" aria-pressed="false" aria-label="Choose Manta ray"><img src="avatars/08-manta-ray.png" alt="Manta ray avatar"><span>Manta ray</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Starfish" data-file="avatars/09-starfish.png" aria-pressed="false" aria-label="Choose Starfish"><img src="avatars/09-starfish.png" alt="Starfish avatar"><span>Starfish</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Seal" data-file="avatars/10-seal.png" aria-pressed="false" aria-label="Choose Seal"><img src="avatars/10-seal.png" alt="Seal avatar"><span>Seal</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Clownfish" data-file="avatars/11-clownfish.png" aria-pressed="false" aria-label="Choose Clownfish"><img src="avatars/11-clownfish.png" alt="Clownfish avatar"><span>Clownfish</span><b aria-hidden="true">✓</b></button>
<button class="avatar-option" type="button" data-name="Sea slug" data-file="avatars/12-nudibranch.png" aria-pressed="false" aria-label="Choose Sea slug"><img src="avatars/12-nudibranch.png" alt="Sea slug avatar"><span>Sea slug</span><b aria-hidden="true">✓</b></button></div>
<footer><span>Design preview · Choose any creature to see it at chat size.</span><a href="motion-preview.html">See Jelly working →</a><a href="familiar-sea-final.png">Desktop + mobile concept →</a></footer>
</main><script>
const buttons=document.querySelectorAll('.avatar-option');
buttons.forEach(button=>button.addEventListener('click',()=>{buttons.forEach(b=>b.setAttribute('aria-pressed','false'));button.setAttribute('aria-pressed','true');document.getElementById('selected-avatar').src=button.dataset.file;document.getElementById('selected-name').textContent=button.dataset.name+' · Selected for preview';}));
</script></body></html>
